<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    
    <!-- Amber Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#facc15" flood-opacity="0.25" />
    </filter>

    <!-- Satellite Shadow -->
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. BASE BACKGROUND SQUIRCLE -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />

  <!-- 2. ORBITAL MANAGEMENT RING -->
  <!-- Outer Orbit Track -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="6 6" />
  <!-- Active Tech Arcs -->
  <path d="M 250 65 A 185 185 0 0 1 435 250" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 250 435 A 185 185 0 0 1 65 250" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="250" cy="250" r="145" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 3. VEHICLES SILHOUETTE (FLAT 2D) -->
  <!-- A. Mobil di Latar Belakang (Slate / Silver Metallic Flat) -->
  <g id="car-silhouette" transform="translate(115, 175) scale(0.95)" opacity="0.9">
    <!-- Body Mobil -->
    <path d="M 15 85 
             C 25 80, 50 65, 75 60 
             L 115 35 
             C 140 20, 200 20, 235 35 
             L 265 60 
             C 285 62, 305 72, 310 85 
             C 310 92, 305 98, 295 98 
             L 275 98 
             C 270 82, 252 72, 235 72 
             C 218 72, 202 82, 195 98 
             L 105 98 
             C 98 82, 82 72, 65 72 
             C 48 72, 32 82, 25 98 
             L 10 98 
             C 5 95, 5 88, 15 85 Z" 
          fill="#334155" 
          stroke="#64748b" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <!-- Kaca Mobil Flat -->
    <path d="M 85 58 L 122 36 C 140 25, 190 25, 205 36 L 235 58 Z" 
          fill="#1e293b" 
          stroke="#475569" 
          stroke-width="1.5" />
    <line x1="162" y1="28" x2="162" y2="58" stroke="#334155" stroke-width="2" />

    <!-- Lampu Depan & Belakang Mobil -->
    <polygon points="302,78 310,83 300,85" fill="#facc15" opacity="0.9" />
    <polygon points="12,82 20,80 18,87" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- B. Motor di Depan / Foreground (Amber Gold #FACC15 Flat Dynamic) -->
  <g id="motorcycle-silhouette" transform="translate(135, 195) scale(0.85)" filter="url(#amberGlow)">
    <!-- Roda Belakang Motor -->
    <circle cx="50" cy="115" r="30" fill="none" stroke="#facc15" stroke-width="7" />
    <circle cx="50" cy="115" r="14" fill="#18181b" stroke="#facc15" stroke-width="2" />

    <!-- Roda Depan Motor -->
    <circle cx="230" cy="115" r="30" fill="none" stroke="#facc15" stroke-width="7" />
    <circle cx="230" cy="115" r="14" fill="#18181b" stroke="#facc15" stroke-width="2" />

    <!-- Rangka, Tangki, & Bodi Motor Sport / Naked Flat -->
    <!-- Swingarm & Rantai -->
    <path d="M 50 115 L 105 105 L 135 115" fill="none" stroke="#eab308" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Sasis Utama & Mesin -->
    <polygon points="100,105 145,105 155,75 115,70" fill="#18181b" stroke="#facc15" stroke-width="3" />
    
    <!-- Tangki & Bodi Atas -->
    <path d="M 95 68 
             C 105 52, 130 45, 150 48 
             L 175 62 
             L 155 75 
             L 105 75 Z" 
          fill="#facc15" 
          stroke="#ca8a04" 
          stroke-width="1.5" />

    <!-- Jok / Seat -->
    <path d="M 75 65 C 85 62, 100 65, 110 70 L 95 76 Z" fill="#ffffff" />

    <!-- Fork & Stang Depan -->
    <line x1="230" y1="115" x2="175" y2="40" stroke="#facc15" stroke-width="5" stroke-linecap="round" />
    <!-- Handlebar & Headlight -->
    <path d="M 165 42 L 180 38 L 192 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="190" cy="46" r="3.5" fill="#facc15" />
    
    <!-- Knalpot / Exhaust Flat -->
    <path d="M 115 105 L 140 108 L 80 118" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 4. ORBITAL SATELLITE NODES (IKON MANAJEMEN ESTETIK) -->

  <!-- SATELIT 1: SPEEDOMETER (Atas / Top - 12 o'clock: Tracking & Kecepatan) -->
  <g transform="translate(250, 65)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#facc15" stroke-width="3" />
    <!-- Ikon Speedometer -->
    <path d="M -15 6 A 16 16 0 1 1 15 6" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
    <!-- Ticks -->
    <line x1="-12" y1="0" x2="-8" y2="0" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="-12" x2="0" y2="-8" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="12" y1="0" x2="8" y2="0" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Jarum Speedometer -->
    <circle cx="0" cy="5" r="3" fill="#ffffff" />
    <line x1="0" y1="5" x2="7" y2="-6" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- SATELIT 2: BENSIN / FUEL (Kanan / Right - 3 o'clock: Manajemen BBM) -->
  <g transform="translate(435, 250)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#facc15" stroke-width="3" />
    <!-- Ikon Fuel Pump Nozzle Flat -->
    <!-- Pompa Dispenser -->
    <rect x="-12" y="-11" width="13" height="22" rx="3" fill="none" stroke="#facc15" stroke-width="2.2" />
    <rect x="-9" y="-7" width="7" height="6" rx="1" fill="#facc15" />
    <!-- Selang & Nozzle -->
    <path d="M 1 -3 L 4 -3 C 8 -3, 8 11, 4 11 L 3 11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 5 -7 L 8 -11 L 10 -9 L 8 -5" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SATELIT 3: SERVICE / WRENCH (Bawah / Bottom - 6 o'clock: Perawatan & Servis) -->
  <g transform="translate(250, 435)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#facc15" stroke-width="3" />
    <!-- Ikon Kunci Pas / Wrench Flat Estetik -->
    <path d="M -7 -10 
             C -11 -6, -11 0, -6 4 
             L 6 16 
             C 8 18, 11 18, 13 16 
             C 15 14, 15 11, 13 9 
             L 1 -3 
             C 4 2, 8 0, 7 -5 
             L 3 -3 
             L -1 -7 
             L -3 -3 
             Z" 
          fill="#facc15" 
          stroke="#18181b" 
          stroke-width="1" />
  </g>

  <!-- SATELIT 4: SHIELD / INSPEKSI (Kiri / Left - 9 o'clock: Keamanan & Dokumen/Pajak) -->
  <g transform="translate(65, 250)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#facc15" stroke-width="3" />
    <!-- Ikon Perisai & Centang Validasi -->
    <path d="M -9 -10 L 0 -13 L 9 -10 C 9 -1, 5 9, 0 13 C -5 9, -9 -1, -9 -10 Z" 
          fill="none" 
          stroke="#facc15" 
          stroke-width="2.2" 
          stroke-linejoin="round" />
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. BRANDING TEXT DI BAWAH (FLEETLOG) -->
  <g transform="translate(250, 320)">
    <!-- Horizon Line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#facc15" />
  </g>
</svg>
